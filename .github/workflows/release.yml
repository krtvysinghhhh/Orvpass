name: 'Publish Multi-Platform Binary Releases'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
            archive_type: tar
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos-x86_64
            archive_type: tar
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
            archive_type: tar
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
            archive_type: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v5.5.0"
          fi
          echo "ORVPASS_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release -p orvpass-cli --target ${{ matrix.target }}

      - name: Package Unix Archive
        if: matrix.archive_type == 'tar'
        shell: bash
        run: |
          mkdir -p release_assets
          ASSET_NAME="orvpass-${ORVPASS_VERSION}-${{ matrix.platform }}.tar.gz"
          cp target/${{ matrix.target }}/release/orvpass orvpass
          tar -czf "release_assets/${ASSET_NAME}" orvpass README.md LICENSE
          cd release_assets && shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Package Windows Archive
        if: matrix.archive_type == 'zip'
        shell: bash
        run: |
          mkdir -p release_assets
          ASSET_NAME="orvpass-${ORVPASS_VERSION}-${{ matrix.platform }}.zip"
          cp target/${{ matrix.target }}/release/orvpass.exe orvpass.exe
          7z a "release_assets/${ASSET_NAME}" orvpass.exe README.md LICENSE
          cd release_assets && sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release_assets/*
          fail_on_unmatched_files: false
